# Orbis Supabase CLI config
# Docs: https://supabase.com/docs/guides/cli

project_id = "orbis-hris"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.summarize-stay-interview]
verify_jwt = true

[functions.investigation-hr-guidance]
verify_jwt = true

[functions.analyze-stay-themes]
verify_jwt = true

[functions.document-signature]
verify_jwt = false

[functions.send-time-off-report]
verify_jwt = true

[functions.sync-qbt-pto]
verify_jwt = true

[functions.sync-qbt-attendance]
# false (like document-signature) because pg_cron authenticates with a dedicated shared
# secret, not a Supabase-issued JWT -- the platform gateway would reject that bearer token
# before it ever reached the function if this were true. The function verifies auth itself:
# either the ATTENDANCE_SYNC_SECRET (cron) or a real admin JWT via requireOrbisAuth (the
# "Sync now" button).
verify_jwt = false
