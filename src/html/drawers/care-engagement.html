        <aside class="drawer hidden" id="careEngagementDrawer" aria-hidden="true">
          <div class="drawer-header">
            <div>
              <h2 class="drawer-title" id="careEngagementDrawerTitle">Care Record</h2>
              <div class="drawer-sub" id="careEngagementDrawerSub">Care & Engagement</div>
            </div>
            <button class="drawer-close" type="button" id="careEngagementDrawerClose">Close</button>
          </div>
          <div class="drawer-body">
            <div class="card">
              <div class="card-header" id="careEditorCardTitle">Edit</div>
              <div class="card-body">
                <div id="careEditorMatrixFields" class="hidden">
                  <div class="field">
                    <label for="careMatrixInitiativesInput">Current initiatives</label>
                    <textarea id="careMatrixInitiativesInput" rows="3"></textarea>
                  </div>
                  <div class="field">
                    <label for="careMatrixGapsInput">Identified gaps</label>
                    <textarea id="careMatrixGapsInput" rows="2"></textarea>
                  </div>
                  <div class="field">
                    <label for="careMatrixActionsInput">Proposed actions</label>
                    <textarea id="careMatrixActionsInput" rows="2"></textarea>
                  </div>
                  <div class="two-col">
                    <div class="field">
                      <label for="careMatrixOwnerInput">Owner</label>
                      <input id="careMatrixOwnerInput" type="text" />
                    </div>
                    <div class="field">
                      <label for="careMatrixDueInput">Due date</label>
                      <input id="careMatrixDueInput" type="date" />
                    </div>
                    <div class="field">
                      <label for="careMatrixStatusInput">Status</label>
                      <select id="careMatrixStatusInput">
                        <option value="current">Current</option>
                        <option value="gap">Gap</option>
                        <option value="proposed">Proposed</option>
                        <option value="in_progress">In Progress</option>
                        <option value="complete">Complete</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div id="careEditorItemFields" class="hidden">
                  <div class="two-col">
                    <div class="field">
                      <label for="careItemEmployeeInput">Employee</label>
                      <select id="careItemEmployeeInput">
                        <option value="">Select employee</option>
                      </select>
                    </div>
                    <div class="field">
                      <label for="careItemDepartmentInput">Department</label>
                      <input id="careItemDepartmentInput" type="text" />
                    </div>
                    <div class="field">
                      <label for="careItemTypeInput">Type</label>
                      <select id="careItemTypeInput">
                        <option value="physical">Physical</option>
                        <option value="emotional">Emotional</option>
                        <option value="spiritual">Spiritual / Values-Based</option>
                      </select>
                    </div>
                    <div class="field">
                      <label for="careItemStatusInput">Status</label>
                      <select id="careItemStatusInput">
                        <option value="open">Open</option>
                        <option value="in_progress">In Progress</option>
                        <option value="follow_up">Follow Up</option>
                        <option value="resolved">Resolved</option>
                        <option value="closed">Closed</option>
                      </select>
                    </div>
                    <div class="field">
                      <label for="careItemOwnerInput">Owner</label>
                      <input id="careItemOwnerInput" type="text" />
                    </div>
                    <div class="field">
                      <label for="careItemFollowUpInput">Follow-up date</label>
                      <input id="careItemFollowUpInput" type="date" />
                    </div>
                    <div class="field">
                      <label for="careItemConfidentialityInput">Confidentiality</label>
                      <select id="careItemConfidentialityInput">
                        <option value="standard" title="Visible to HR admins and all supervisors with Care access">
                          Standard
                        </option>
                        <option
                          value="restricted"
                          title="Visible to HR admins and this employee's supervisor only"
                        >
                          Restricted
                        </option>
                        <option value="hr_only" title="Visible to HR admins only">HR Only</option>
                      </select>
                    </div>
                  </div>
                  <div class="field">
                    <label for="careItemNeedInput">Need or concern</label>
                    <textarea id="careItemNeedInput" rows="3"></textarea>
                  </div>
                  <div class="field">
                    <label for="careItemActionInput">Action taken</label>
                    <textarea id="careItemActionInput" rows="3"></textarea>
                  </div>
                </div>
                <div id="careEditorRecognitionFields" class="hidden">
                  <div class="two-col">
                    <div class="field">
                      <label for="careRecEmployeeInput">Employee</label>
                      <select id="careRecEmployeeInput">
                        <option value="">Select employee</option>
                      </select>
                    </div>
                    <div class="field">
                      <label for="careRecDepartmentInput">Department</label>
                      <input id="careRecDepartmentInput" type="text" />
                    </div>
                    <div class="field">
                      <label for="careRecTypeInput">Type</label>
                      <select id="careRecTypeInput">
                        <option value="kudos">Kudos</option>
                        <option value="iron_shift">Iron Shift Nomination</option>
                        <option value="work_anniversary">Work Anniversary</option>
                        <option value="above_and_beyond">Above & Beyond</option>
                        <option value="peer_recognition">Peer Recognition</option>
                      </select>
                    </div>
                    <div class="field">
                      <label for="careRecDateInput">Recognized on</label>
                      <input id="careRecDateInput" type="date" />
                    </div>
                    <div class="field">
                      <label for="careRecByInput">Recognized by</label>
                      <input id="careRecByInput" type="text" />
                    </div>
                  </div>
                  <div class="field">
                    <label for="careRecSummaryInput">Summary</label>
                    <textarea id="careRecSummaryInput" rows="3"></textarea>
                  </div>
                </div>
                <div id="careEditorPulseFields" class="hidden">
                  <p class="muted" style="margin: 0 0 12px">
                    Enter rolled-up averages from your pulse survey (1.0–5.0). Individual responses stay
                    in your survey tool.
                  </p>
                  <div class="two-col">
                    <div class="field">
                      <label for="carePulsePeriodInput">Period label</label>
                      <input
                        id="carePulsePeriodInput"
                        type="text"
                        placeholder="e.g. Q3 2026 Pulse"
                      />
                    </div>
                    <div class="field">
                      <label for="carePulseResponseCountInput">Response count</label>
                      <input id="carePulseResponseCountInput" type="number" min="0" step="1" />
                    </div>
                    <div class="field">
                      <label for="carePulseOverallInput">Overall support (1–5)</label>
                      <input id="carePulseOverallInput" type="number" min="0" max="5" step="0.1" />
                    </div>
                    <div class="field">
                      <label for="carePulseWorkloadInput">Workload stress (1–5)</label>
                      <input id="carePulseWorkloadInput" type="number" min="0" max="5" step="0.1" />
                    </div>
                    <div class="field">
                      <label for="carePulseCommunicationInput">Communication (1–5)</label>
                      <input
                        id="carePulseCommunicationInput"
                        type="number"
                        min="0"
                        max="5"
                        step="0.1"
                      />
                    </div>
                    <div class="field">
                      <label for="carePulseRecognitionInput">Recognition (1–5)</label>
                      <input
                        id="carePulseRecognitionInput"
                        type="number"
                        min="0"
                        max="5"
                        step="0.1"
                      />
                    </div>
                    <div class="field">
                      <label for="carePulseBelongingInput">Belonging (1–5)</label>
                      <input id="carePulseBelongingInput" type="number" min="0" max="5" step="0.1" />
                    </div>
                  </div>
                  <div class="field">
                    <label for="carePulseCommentsInput">Themes / open comments summary</label>
                    <textarea id="carePulseCommentsInput" rows="4"></textarea>
                  </div>
                </div>
                <div id="careEditorNoteFields" class="hidden">
                  <div class="two-col">
                    <div class="field">
                      <label for="careNoteDateInput">Date</label>
                      <input id="careNoteDateInput" type="date" />
                    </div>
                    <div class="field">
                      <label for="careNoteAuthorInput">Author</label>
                      <input id="careNoteAuthorInput" type="text" />
                    </div>
                    <div class="field">
                      <label for="careNoteConfidentialityInput">Confidentiality</label>
                      <select id="careNoteConfidentialityInput">
                        <option value="standard" title="Visible to HR admins and all supervisors with Care access">
                          Standard
                        </option>
                        <option
                          value="restricted"
                          title="Visible to HR admins and this employee's supervisor only"
                        >
                          Restricted
                        </option>
                        <option value="hr_only" title="Visible to HR admins only">HR Only</option>
                      </select>
                    </div>
                  </div>
                  <div class="field">
                    <label for="careNoteSummaryInput">Summary</label>
                    <textarea id="careNoteSummaryInput" rows="3"></textarea>
                  </div>
                </div>
                <div id="careEditorFollowUpFields" class="hidden">
                  <div class="two-col">
                    <div class="field">
                      <label for="careFollowUpTitleInput">Title</label>
                      <input id="careFollowUpTitleInput" type="text" />
                    </div>
                    <div class="field">
                      <label for="careFollowUpDueInput">Due date</label>
                      <input id="careFollowUpDueInput" type="date" />
                    </div>
                    <div class="field">
                      <label for="careFollowUpOwnerInput">Owner</label>
                      <input id="careFollowUpOwnerInput" type="text" />
                    </div>
                    <div class="field">
                      <label for="careFollowUpStatusInput">Status</label>
                      <select id="careFollowUpStatusInput">
                        <option value="open">Open</option>
                        <option value="in_progress">In Progress</option>
                        <option value="follow_up">Follow Up</option>
                        <option value="resolved">Resolved</option>
                        <option value="closed">Closed</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div id="careEditorResourceFields" class="hidden">
                  <div class="two-col">
                    <div class="field">
                      <label for="careResourceNameInput">Resource name</label>
                      <input id="careResourceNameInput" type="text" />
                    </div>
                    <div class="field">
                      <label for="careResourceDateInput">Shared on</label>
                      <input id="careResourceDateInput" type="date" />
                    </div>
                    <div class="field">
                      <label for="careResourceByInput">Shared by</label>
                      <input id="careResourceByInput" type="text" />
                    </div>
                  </div>
                </div>
                <div id="careEditorWellnessFields" class="hidden">
                  <div class="two-col">
                    <div class="field">
                      <label for="careWellnessTypeInput">Check-in type</label>
                      <input id="careWellnessTypeInput" type="text" />
                    </div>
                    <div class="field">
                      <label for="careWellnessDateInput">Date</label>
                      <input id="careWellnessDateInput" type="date" />
                    </div>
                    <div class="field">
                      <label for="careWellnessOwnerInput">Owner</label>
                      <input id="careWellnessOwnerInput" type="text" />
                    </div>
                  </div>
                  <div class="field">
                    <label for="careWellnessNotesInput">Notes</label>
                    <textarea id="careWellnessNotesInput" rows="3"></textarea>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="drawer-footer">
            <button class="button primary" id="saveCareEngagementBtn" type="button">Save</button>
            <button class="button soft" id="cancelCareEngagementBtn" type="button">Cancel</button>
            <button class="button danger hidden" id="deleteCareEngagementBtn" type="button">Delete</button>
          </div>
        </aside>
