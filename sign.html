<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign document | Orbis</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token') || params.get('signToken');
        var target = token
          ? '/?signToken=' + encodeURIComponent(token)
          : '/';
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: system-ui, sans-serif; padding: 24px; color: #555">
      Redirecting to Orbis…
    </p>
  </body>
</html>
