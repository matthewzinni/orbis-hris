<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign document | Orbis</title>
    <link rel="stylesheet" href="/src/styles/orbis-brand.css" />
    <link rel="stylesheet" href="/src/styles/signature-field.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: linear-gradient(180deg, #f0f3f6 0%, #e9edf2 100%);
        color: #1f2937;
      }
      .sign-shell {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      .sign-card {
        background: #fff;
        border: 1px solid #d9e2ec;
        border-radius: 16px;
        box-shadow: 0 10px 32px rgba(22, 50, 79, 0.08);
        padding: 20px;
      }
      .sign-brand {
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 8px;
      }
      .sign-title {
        margin: 0 0 6px;
        font-size: 1.4rem;
      }
      .sign-meta {
        color: #6b7280;
        font-size: 0.9rem;
        margin-bottom: 14px;
      }
      .sign-summary {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 12px;
        font-size: 0.92rem;
        white-space: pre-wrap;
        margin-bottom: 16px;
      }
      .sign-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .button {
        border-radius: 10px;
        border: 1px solid #d9e2ec;
        background: #fff;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }
      .button.primary {
        background: #2f6fed;
        border-color: #2f6fed;
        color: #fff;
      }
      .sign-preview {
        margin-top: 10px;
        border: 1px dashed #cbd5e1;
        border-radius: 10px;
        min-height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      .sign-preview img {
        max-width: 100%;
        max-height: 140px;
      }
      .sign-error {
        color: #b42318;
        background: #fef3f2;
        border: 1px solid #fecdca;
        border-radius: 10px;
        padding: 12px;
      }
      .sign-success {
        color: #027a48;
        background: #ecfdf3;
        border: 1px solid #abefc6;
        border-radius: 10px;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <div class="sign-shell">
      <div class="sign-card" id="signCard">
        <div class="sign-brand">Orbis · BTW Global</div>
        <h1 class="sign-title" id="signTitle">Document signing</h1>
        <div class="sign-meta" id="signMeta">Loading…</div>
        <div id="signBody">
          <div class="empty">Loading document…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/sign.ts"></script>
  </body>
</html>
