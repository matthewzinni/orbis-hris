# Monday time-off email to leadership — pulls this week's time off from QuickBooks Time (TSheets).
# Runs in the cloud (no Mac awake required).
# Schedule: 7:00 AM US Eastern every Monday. GitHub can start scheduled runs hours late, so the
# workflow fires every 20 minutes from 11:07 to 16:47 UTC. The first run at or after 7 AM Eastern
# sends (this handles daylight saving) and saves a "sent" marker artifact; later runs that week
# see the marker and skip.
# Manual run: GitHub → Actions → Weekly Time Off Email → Run workflow (sends immediately).

name: Weekly Time Off Email

on:
  schedule:
    - cron: '7,27,47 11-16 * * 1'
  workflow_dispatch:
    inputs:
      week_of:
        description: 'Any date in the week to report (YYYY-MM-DD). Blank = this week.'
        required: false
        default: ''
      mail_to:
        description: 'Send only to these addresses (comma-separated). Blank = normal leadership list.'
        required: false
        default: ''

permissions:
  actions: read
  contents: read

concurrency:
  group: weekly-time-off-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this week's email already went out
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          monday=$(python3 -c "from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; d = datetime.now(ZoneInfo('America/New_York')).date(); print(d - timedelta(days=d.weekday()))")
          marker="time-off-email-sent-$monday"
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$marker" --jq '[.artifacts[] | select(.expired | not)] | length')
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "Already sent this week ($marker); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send time off email
        id: send
        if: steps.check.outputs.skip != 'true'
        env:
          QBT_ACCESS_TOKEN: ${{ secrets.QBT_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          TIME_OFF_EXTRA_EMAILS: ${{ secrets.TIME_OFF_EXTRA_EMAILS }}
          WEEK_OF: ${{ github.event.inputs.week_of }}
          TIME_OFF_MAIL_TO: ${{ github.event.inputs.mail_to }}
          WEEKLY_REPORT_MAX_ATTEMPTS: '5'
          WEEKLY_REPORT_RETRY_WAIT_SECONDS: '300'
        run: |
          args=()
          if [ "${{ github.event_name }}" = "schedule" ]; then args+=(--scheduled); fi
          if [ -n "$WEEK_OF" ]; then args+=(--week-of "$WEEK_OF"); fi
          python3 scripts/weekly_time_off_email.py "${args[@]}"

      - name: Record that this week's email went out
        if: github.event_name == 'schedule' && steps.send.outputs.sent == 'true'
        run: echo "sent" > sent.txt

      - name: Save sent marker
        if: github.event_name == 'schedule' && steps.send.outputs.sent == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.check.outputs.marker }}
          path: sent.txt
          retention-days: 7
